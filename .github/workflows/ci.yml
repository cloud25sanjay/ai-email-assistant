
name: AI Email Assistant CI

# Run CI whenever code is pushed to main or a feature branch,
# or when a pull request targets main.
on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      # Download the repository onto the GitHub runner.
      - name: Checkout source code
        uses: actions/checkout@v7

      # Install Java 25 and cache Maven dependencies.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Build the application and execute tests.
      - name: Build and verify
        run: bash ./mvnw -B clean verify
